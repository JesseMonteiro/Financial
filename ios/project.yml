name: MeuFlux
options:
  bundleIdPrefix: com.meuflux
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  # XcodeGen omits package= backlinks for local SPM; Xcode then shows Missing package product.
  postGenCommand: python3 scripts/fix-local-package-backlinks.py
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
packages:
  MeuFlux:
    path: .
targets:
  MeuFlux:
    type: application
    platform: iOS
    sources:
      - path: MeuFluxApp
        excludes:
          - "Config/**"
          - "*.entitlements"
    dependencies:
      - target: MeuFluxWidgets
        embed: true
      - package: MeuFlux
        product: MeuFluxCore
      - package: MeuFlux
        product: MeuFluxDomain
      - package: MeuFlux
        product: MeuFluxData
      - package: MeuFlux
        product: MeuFluxDesignSystem
      - package: MeuFlux
        product: Authentication
      - package: MeuFlux
        product: Dashboard
      - package: MeuFlux
        product: Accounts
      - package: MeuFlux
        product: Transactions
      - package: MeuFlux
        product: CreditCards
      - package: MeuFlux
        product: Investments
      - package: MeuFlux
        product: Loans
      - package: MeuFlux
        product: Budget
      - package: MeuFlux
        product: Goals
      - package: MeuFlux
        product: Categories
      - package: MeuFlux
        product: MealVouchers
      - package: MeuFlux
        product: Receivables
      - package: MeuFlux
        product: ManualExpenses
      - package: MeuFlux
        product: FinancialMoment
      - package: MeuFlux
        product: JointFinance
      - package: MeuFlux
        product: Subscriptions
      - package: MeuFlux
        product: Agenda
      - package: MeuFlux
        product: Reports
      - package: MeuFlux
        product: BankConnections
      - package: MeuFlux
        product: Settings
      - package: MeuFlux
        product: NotificationImport
      - package: MeuFlux
        product: MeuFluxIntelligence
    entitlements:
      path: MeuFluxApp/MeuFlux.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.meuflux.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meuflux.app
        CODE_SIGN_ENTITLEMENTS: MeuFluxApp/MeuFlux.entitlements
        INFOPLIST_FILE: MeuFluxApp/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MeuFlux
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
    configFiles:
      Debug: MeuFluxApp/Config/Debug.xcconfig
      Release: MeuFluxApp/Config/Production.xcconfig
  MeuFluxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeuFluxTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.meuflux.MeuFluxTests
    dependencies:
      - target: MeuFlux
      - package: MeuFlux
        product: MeuFluxDomain
      - package: MeuFlux
        product: MeuFluxCore
      - package: MeuFlux
        product: MeuFluxData
      - package: MeuFlux
        product: MeuFluxDesignSystem
      - package: MeuFlux
        product: MeuFluxIntelligence
  MeuFluxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MeuFluxWidgets
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: MeuFlux
        product: MeuFluxCore
    entitlements:
      path: MeuFluxWidgets/MeuFluxWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.meuflux.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meuflux.app.widgets
        CODE_SIGN_ENTITLEMENTS: MeuFluxWidgets/MeuFluxWidgets.entitlements
        INFOPLIST_FILE: MeuFluxWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: MeuFlux Widgets
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.meuflux.app.debug.widgets
schemes:
  MeuFlux:
    build:
      targets:
        MeuFlux: all
        MeuFluxWidgets: all
    test:
      targets:
        - MeuFluxTests
    run:
      config: Debug
